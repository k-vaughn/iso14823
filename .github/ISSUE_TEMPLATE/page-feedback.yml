name: Page feedback
description: Comment on a sign page or on the register documentation
title: "[Page feedback] "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Use this form to report an error or suggest a change to a page on the Registry for ITS Graphics.

        Fields marked with * are required. Page title and path are filled in when you open this form from a page on the site.
  - type: input
    id: page-title
    attributes:
      label: Page title
      description: Heading shown on the page.
      placeholder: 12-112 · STOP
    validations:
      required: true
  - type: input
    id: page-path
    attributes:
      label: Page path
      description: Path within the repository, for example `signs/12-112.md`.
      placeholder: signs/12-112.md
    validations:
      required: true
  - type: dropdown
    id: feedback-type
    attributes:
      label: Type of feedback
      options:
        - Correction (name, definition, status, code, graphic)
        - Missing country graphic
        - Clarification request
        - Website or formatting issue
        - Other
    validations:
      required: true
  - type: textarea
    id: comment
    attributes:
      label: Your comment
      description: Describe the change. Include the pictogram code and, for a graphic, the country.
      placeholder: 12-112 STOP should say…
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Contribution
      options:
        - label: I understand this is a public GitHub issue and may be used to update the register.
          required: true
